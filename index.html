<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f3ec">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141613">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!--head-->
<script type="module" src="/src/main.ts"></script>
<noscript><style>#power-row { display: none; }</style></noscript>
<style>
:root {
  --bg: #f6f3ec; --fg: #1e1f1c; --muted: #5b5a52; --link: #1f5f8b; --accent: #9c5b00;
  --rule: #d9d3c4; --tape: #1e1f1c; --on-tape: #f6f3ec;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141613; --fg: #e8e2d3; --muted: #a8a293; --link: #8cc4f0; --accent: #f0b54a;
    --rule: #34372f; --tape: #e8e2d3; --on-tape: #141613;
  }
}
html { background: var(--bg); color: var(--fg); font: 1.0625rem/1.6 var(--sans); }
body { max-width: 72ch; margin: 0 auto; padding: 0 1rem 3rem; }
a { color: var(--link); text-underline-offset: .18em; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
header { padding-block: clamp(2.5rem, 8vw, 5rem) 1.5rem; border-bottom: 2px solid var(--fg); }
h1 { font-size: clamp(2.4rem, 1.6rem + 4vw, 3.6rem); line-height: 1.05; letter-spacing: -.025em; margin: 0 0 1rem; }
.headline { font-size: clamp(1.15rem, 1rem + .6vw, 1.35rem); line-height: 1.45; margin: 0 0 .75rem; }
.links { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem; padding: 0; margin: 1.25rem 0; }
.links a { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .75rem; border: 1px solid var(--rule); border-radius: 999px; text-decoration: none; font-weight: 600; }
.links a:hover { border-color: var(--link); }
.note, .byline, .more { color: var(--muted); font-size: .9rem; }
.byline { font-family: var(--mono); font-size: .8rem; margin: .25rem 0 .75rem; }
h2 { font-size: .85rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); margin: 3rem 0 0; }
h2 + .note { margin: .25rem 0 0; }
article { padding-block: 1.5rem; border-bottom: 1px solid var(--rule); }
h3 { font-size: 1.35rem; line-height: 1.25; margin: 0; }
#flagship h3 { font-size: 1.6rem; }
.tape { display: inline-block; vertical-align: .2em; font: 700 .7rem/1 var(--mono); letter-spacing: .14em; padding: .35em .6em; background: var(--tape); color: var(--on-tape); border-radius: 3px; }
.claims { padding-left: 1rem; border-left: 3px solid var(--accent); list-style: none; }
.claims li + li { margin-top: .6rem; }
.src { font-family: var(--mono); font-size: .75rem; white-space: nowrap; }
.figure { margin: 1rem 0; }
.visual { display: block; width: 100%; height: auto; border: 1px solid var(--rule); border-radius: 6px; }
.figure figcaption { margin-top: .45rem; color: var(--muted); font-size: .85rem; }
/* Visuals rise into place as they scroll into view, where the browser can tie an animation to
   scrolling; nothing moves for visitors who ask for less motion. */
@media (prefers-reduced-motion: no-preference) {
  @supports (animation-timeline: view()) {
    .visual { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 70%; }
  }
}
@keyframes rise { from { opacity: 0; transform: translateY(1.25rem) scale(.98); } }
.more { margin: .75rem 0 0; }
#power-row p { margin: 0 0 .5rem; }
#power {
  font: inherit; font-weight: 600; color: var(--fg); background: transparent; cursor: pointer;
  padding: .3rem .9rem; margin-right: .35rem; border: 1px solid var(--fg); border-radius: 999px;
}
#power:hover { background: var(--fg); color: var(--bg); }
#power:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* On phones the way into 3D is a large button. */
@media (max-width: 599px), (pointer: coarse) and (max-device-width: 599px), (pointer: coarse) and (max-device-height: 599px) {
  #power { display: block; width: 100%; margin: 0 0 .5rem; padding: .8rem 1rem; font-size: 1.15rem; }
}
/* The project list (scripts/render.ts): a collapsed summary on narrow screens; from 1080 px a
   column beside the content that stays in view, opened by src/main.ts. */
#toc { margin: 1.25rem 0 0; font-size: .9rem; }
#toc summary { cursor: pointer; width: fit-content; font: 600 .8rem/1.6 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent); }
#toc summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#toc ul { list-style: none; margin: 0; padding: 0; }
#toc span { display: block; margin: .9rem 0 .2rem; font: .7rem/1.35 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
#toc a { display: block; padding: .2rem 0 .2rem .65rem; border-left: 2px solid var(--rule); color: var(--fg); text-decoration: none; }
#toc a:hover { color: var(--link); border-left-color: var(--link); }
#toc a:focus-visible { outline-offset: -3px; } /* inside the list, which clips what overflows it */
#toc a[aria-current] { border-left: 3px solid var(--accent); padding-left: .6rem; font-weight: 600; }
@media (min-width: 1080px) {
  body { max-width: calc(72ch + 17rem); display: grid; grid-template-columns: 14rem minmax(0, 72ch); column-gap: 3rem; }
  body > :not(nav) { grid-column: 2; }
  body > nav { grid-column: 1; grid-row: 1 / span 3; }
  #toc { position: sticky; top: 0; box-sizing: border-box; max-height: 100vh; max-height: 100dvh; overflow-y: auto; margin: 0; padding-block: 5rem 1rem; }
  #toc[open] > summary { display: none; }
}
footer { margin-top: 2rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<!--body-->
</body>
</html>
