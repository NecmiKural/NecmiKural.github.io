name: site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # weekly: catches drift from the profile repo between site pushes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Content matches the profile repo's main, byte for byte
        run: npm run sync-content -- --check
      - run: npm run build
      - name: Types and copy (repo and dist)
        run: npm run check
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - run: npm run size
      # The browsers' system packages are about 120 MB from the Ubuntu mirror, which now and then
      # crawls at 100 KB/s (run 40261475018). apt is not killed and retried, which left it holding
      # the dpkg lock; instead its .deb files are cached, so a run downloads only what changed.
      - name: Cache key for the browsers' system packages
        id: debs-key
        run: |
          echo "prefix=debs-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=debs-$ImageOS-$ImageVersion-playwright-$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: debs
        with:
          path: ~/apt-debs
          key: ${{ steps.debs-key.outputs.key }}
          restore-keys: ${{ steps.debs-key.outputs.prefix }}
      - name: Install browser system packages
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-debs/partial
          echo "Dir::Cache::Archives \"$HOME/apt-debs\";" | sudo tee /etc/apt/apt.conf.d/zzz-site-debs
          npx playwright install-deps chromium firefox webkit
          sudo chown -R "$(id -u):$(id -g)" ~/apt-debs # apt leaves them root-owned; the cache saves as this user
      - if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.debs-key.outputs.key }}
      # The browsers come from Playwright's own servers and touch no system package, so a stalled
      # download can be killed and tried again.
      - name: Install browsers
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout 180 npx playwright install chromium firefox webkit && exit 0
            echo "browser download attempt $attempt did not finish; retrying"
          done
          exit 1
      - run: npm test
      - run: npx lhci autorun
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --timeout 90 --max-retries 2
            --exclude 'linkedin\.com' --exclude '^https://necmikural\.github\.io'
            dist/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            test-results
            .lighthouseci/reports
          if-no-files-found: ignore
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Mirrors dist/ to the static Hugging Face Space necmikural/portfolio. The token lives only in
  # this job's environment, where npm never runs; until it is set, every step after the check
  # is skipped. --delete "*" drops files from earlier builds; HF never deletes .gitattributes.
  space:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    environment: hugging-face
    concurrency:
      group: hugging-face
      cancel-in-progress: false
    steps:
      - id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN is not set: skipping the Space upload"; exit 0; fi
          echo "upload=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.upload == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: space
      - if: steps.check.outputs.upload == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: steps.check.outputs.upload == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - if: steps.check.outputs.upload == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cp space/README.md dist/README.md
          uvx --from huggingface_hub==2.3.0 hf upload necmikural/portfolio dist . \
            --repo-type space --delete "*" --commit-message "deploy ${GITHUB_SHA::7}"
